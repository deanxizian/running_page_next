name: Run Data Sync

on:
  workflow_dispatch:
    inputs:
      refresh_locations:
        description: Refresh location_country for existing activities
        required: false
        default: false
        type: boolean
  schedule:
    # Normal incremental sync at 00:00 Asia/Shanghai on days 2-31.
    - cron: '0 0 2-31 * *'
      timezone: 'Asia/Shanghai'
    # Normal incremental sync at 12:00 Asia/Shanghai every day.
    - cron: '0 12 * * *'
      timezone: 'Asia/Shanghai'
    # Monthly sync with existing-location refresh on the 1st.
    - cron: '0 0 1 * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write
  actions: write

env:
  REFRESH_LOCATIONS: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *') || (github.event_name == 'workflow_dispatch' && inputs.refresh_locations) }}
  IGNORE_START_END_RANGE: ${{ vars.IGNORE_START_END_RANGE || '10' }}
  NOMINATIM_USER_AGENT: ${{ vars.NOMINATIM_USER_AGENT || 'running_page_next' }}

concurrency:
  group: strava-data-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Strava data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore encrypted sync cache
        uses: actions/cache/restore@v6
        with:
          path: run_page/data.db.enc
          key: strava-data-encrypted-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            strava-data-encrypted-${{ runner.os }}-${{ github.ref_name }}-
            strava-data-encrypted-${{ runner.os }}-

      - name: Decrypt sync cache
        id: decrypt-cache
        env:
          SYNC_CACHE_PASSPHRASE: ${{ secrets.STRAVA_CLIENT_SECRET }}
        run: |
          echo "restored=false" >> "$GITHUB_OUTPUT"
          if [ ! -s run_page/data.db.enc ]; then
            exit 0
          fi
          if openssl enc -d -aes-256-cbc -pbkdf2 \
            -in run_page/data.db.enc \
            -out run_page/data.db \
            -pass env:SYNC_CACHE_PASSPHRASE; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            rm -f run_page/data.db
            echo "Encrypted sync cache could not be decrypted; rebuilding it."
          fi

      - name: Restore legacy sync cache for migration
        if: steps.decrypt-cache.outputs.restored != 'true'
        uses: actions/cache/restore@v6
        with:
          path: run_page/data.db
          key: strava-data-legacy-migration-${{ github.run_id }}
          restore-keys: |
            strava-data-${{ runner.os }}-${{ github.ref_name }}-
            strava-data-${{ runner.os }}-

      - name: Check refresh-token persistence access
        env:
          GH_TOKEN: ${{ secrets.STRAVA_TOKEN_ROTATION_PAT }}
          PREVIOUS_REFRESH_TOKEN: ${{ secrets.STRAVA_CLIENT_REFRESH_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          test -n "$PREVIOUS_REFRESH_TOKEN"
          for attempt in 1 2 3 4; do
            if printf '%s' "$PREVIOUS_REFRESH_TOKEN" |
              gh secret set STRAVA_CLIENT_REFRESH_TOKEN \
                --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Sync running activities from Strava
        env:
          GH_TOKEN: ${{ secrets.STRAVA_TOKEN_ROTATION_PAT }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_CLIENT_REFRESH_TOKEN: ${{ secrets.STRAVA_CLIENT_REFRESH_TOKEN }}
        run: |
          test -n "$STRAVA_CLIENT_ID"
          test -n "$STRAVA_CLIENT_SECRET"
          test -n "$STRAVA_CLIENT_REFRESH_TOKEN"
          sync_args=(--only-run)
          if [ "$REFRESH_LOCATIONS" = "true" ]; then
            sync_args+=(--force --refresh-locations)
          fi
          token_file="$RUNNER_TEMP/strava_refresh_token"
          sync_args+=(--refresh-token-output "$token_file")

          persist_rotated_token() {
            local sync_pid="$1"
            local latest_refresh_token

            for _ in {1..120}; do
              if [ -s "$token_file" ]; then
                break
              fi
              if ! kill -0 "$sync_pid" 2>/dev/null; then
                echo "Strava sync stopped before producing a refresh token."
                return 1
              fi
              sleep 1
            done

            if [ ! -s "$token_file" ]; then
              echo "Timed out waiting for the rotated Strava refresh token."
              return 1
            fi

            latest_refresh_token="$(<"$token_file")"
            if [ "$latest_refresh_token" = "$STRAVA_CLIENT_REFRESH_TOKEN" ]; then
              return 0
            fi

            for attempt in 1 2 3 4 5; do
              if printf '%s' "$latest_refresh_token" |
                gh secret set STRAVA_CLIENT_REFRESH_TOKEN \
                  --repo "$GITHUB_REPOSITORY"; then
                return 0
              fi
              if [ "$attempt" -eq 5 ]; then
                return 1
              fi
              sleep $((attempt * 2))
            done
          }

          python run_page/strava_sync.py \
            "$STRAVA_CLIENT_ID" \
            "$STRAVA_CLIENT_SECRET" \
            "$STRAVA_CLIENT_REFRESH_TOKEN" \
            "${sync_args[@]}" &
          sync_pid=$!

          if ! persist_rotated_token "$sync_pid"; then
            kill "$sync_pid" 2>/dev/null || true
            wait "$sync_pid" || true
            exit 1
          fi
          wait "$sync_pid"

      - name: Validate generated activities
        run: |
          python run_page/validate_activities.py \
            src/static/activities.json \
            src/static/activity_routes.json \
            src/static/event_routes.json

      - name: Encrypt sync cache
        env:
          SYNC_CACHE_PASSPHRASE: ${{ secrets.STRAVA_CLIENT_SECRET }}
        run: |
          test -s run_page/data.db
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in run_page/data.db \
            -out run_page/data.db.enc \
            -pass env:SYNC_CACHE_PASSPHRASE

      - name: Save encrypted sync cache
        uses: actions/cache/save@v6
        with:
          path: run_page/data.db.enc
          key: strava-data-encrypted-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove legacy raw sync storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=strava-sync-data-db&per_page=100" \
            --jq '.artifacts[].id' |
            while read -r artifact_id; do
              if [ -n "$artifact_id" ]; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
              fi
            done

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select((.key | startswith("strava-data-")) and (.key | contains("-encrypted-") | not)) | .id' |
            while read -r cache_id; do
              if [ -n "$cache_id" ]; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/actions/caches/$cache_id"
              fi
            done

      - name: Commit updated running data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add \
            src/static/activities.json \
            src/static/activity_routes.json \
            src/static/event_routes.json
          if git diff --cached --quiet; then
            echo "No running data changes to commit."
          else
            git commit -m "update Strava running data"
            git push
          fi

      - name: Trigger GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(git rev-parse HEAD)"
          deployed_sha=""

          for attempt in 1 2 3 4; do
            if deployed_sha="$(
              gh run list \
                --workflow gh-pages.yml \
                --status success \
                --limit 1 \
                --json headSha \
                --jq '.[0].headSha // ""'
            )"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done

          if [ "$deployed_sha" = "$current_sha" ]; then
            echo "GitHub Pages already contains $current_sha."
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if gh workflow run gh-pages.yml --ref "$GITHUB_REF_NAME"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
