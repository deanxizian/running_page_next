name: Run Data Sync

on:
  workflow_dispatch:
    inputs:
      refresh_locations:
        description: Refresh location_country for existing activities
        required: false
        default: false
        type: boolean
  schedule:
    # Normal daily sync at 00:00 Asia/Shanghai.
    - cron: '0 0 2-31 * *'
      timezone: 'Asia/Shanghai'
    # Monthly sync with existing-location refresh on the 1st.
    - cron: '0 0 1 * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REFRESH_LOCATIONS: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *') || (github.event_name == 'workflow_dispatch' && inputs.refresh_locations) }}
  IGNORE_START_END_RANGE: ${{ vars.IGNORE_START_END_RANGE || '10' }}
  NOMINATIM_USER_AGENT: ${{ vars.NOMINATIM_USER_AGENT || 'running_page_next' }}

concurrency:
  group: strava-data-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Strava data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore sync cache
        uses: actions/cache@v5
        with:
          path: run_page/data.db
          key: strava-data-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            strava-data-${{ runner.os }}-${{ github.ref_name }}-
            strava-data-${{ runner.os }}-

      - name: Check refresh-token persistence access
        env:
          GH_TOKEN: ${{ secrets.STRAVA_TOKEN_ROTATION_PAT }}
        run: |
          test -n "$GH_TOKEN"
          gh api "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" >/dev/null

      - name: Sync running activities from Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_CLIENT_REFRESH_TOKEN: ${{ secrets.STRAVA_CLIENT_REFRESH_TOKEN }}
        run: |
          test -n "$STRAVA_CLIENT_ID"
          test -n "$STRAVA_CLIENT_SECRET"
          test -n "$STRAVA_CLIENT_REFRESH_TOKEN"
          sync_args=(--only-run)
          if [ "$REFRESH_LOCATIONS" = "true" ]; then
            sync_args+=(--force --refresh-locations)
          fi
          sync_args+=(--refresh-token-output "$RUNNER_TEMP/strava_refresh_token")
          python run_page/strava_sync.py "$STRAVA_CLIENT_ID" "$STRAVA_CLIENT_SECRET" "$STRAVA_CLIENT_REFRESH_TOKEN" "${sync_args[@]}"

      - name: Persist rotated Strava refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.STRAVA_TOKEN_ROTATION_PAT }}
          PREVIOUS_REFRESH_TOKEN: ${{ secrets.STRAVA_CLIENT_REFRESH_TOKEN }}
        run: |
          if [ ! -s "$RUNNER_TEMP/strava_refresh_token" ]; then
            exit 0
          fi
          latest_refresh_token="$(<"$RUNNER_TEMP/strava_refresh_token")"
          if [ "$latest_refresh_token" != "$PREVIOUS_REFRESH_TOKEN" ]; then
            printf '%s' "$latest_refresh_token" |
              gh secret set STRAVA_CLIENT_REFRESH_TOKEN \
                --repo "$GITHUB_REPOSITORY"
          fi

      - name: Validate generated activities
        run: python run_page/validate_activities.py src/static/activities.json

      - name: Upload sync database artifact
        uses: actions/upload-artifact@v7
        with:
          name: strava-sync-data-db
          path: run_page/data.db
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated running data
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/static/activities.json
          if git diff --cached --quiet; then
            echo "No running data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "update Strava running data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger GitHub Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gh-pages.yml --ref "$GITHUB_REF_NAME"
